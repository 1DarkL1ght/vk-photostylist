[project]
name = "vk-photostylist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Влада Ижденева", email = "shternbergalisa@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "dvc==3.67.1",
    "fire==0.7.1",
    "hydra-core==1.3.7",
    "mlflow==3.16.1",
    "nvidia-cudnn-cu13==9.24.0.43",
    "onnx==1.23.0",
    "onnxruntime==1.30.0",
    "onnxruntime-gpu[cuda,cudnn]==1.30.0",
    "opencv-python==5.0.0.93",
    "peft==0.21.0",
    "pillow==12.3.0",
    "pytorch-lightning==2.6.6",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==5.17.0",
]

[project.scripts]
vk-photostylist = "vk_photostylist:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[project.optional-dependencies]
fa-2 = [
    "flash-attn; platform_machine=='x86_64'",
]
torch-cu130 = [
    "torch==2.14.0+cu130",
    "torchvision==0.29.0+cu130",
]

[[tool.uv.index]]
name = "torch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "torch-cu130" }
torchvision = { index = "torch-cu130" }
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.2/flash_attn-2.8.3+cu130torch2.14-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.10.0/flash_attn-2.8.3+cu130torch2.14-cp313-cp313-linux_x86_64.whl", marker = "sys_platform == 'linux'" }
]

[tool.uv]
add-bounds = "exact"

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # undocumented-public-package
